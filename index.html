<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกยอดเติมน้ำมันประจำเดือน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 flex justify-center items-center">

  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">
    
    <!-- Header -->
    <div class="text-center border-b border-slate-800 pb-5 mb-6">
      <h1 class="text-2xl font-bold text-amber-400">⛽ บันทึกยอดเติมน้ำมัน</h1>
      <p class="text-slate-400 text-sm mt-1">ระบบลงบันทึกการใช้น้ำมันและควบคุมวงเงินบัตร</p>
    </div>

    <form id="fuelForm" class="space-y-6">

      <!-- 1. เลือกรถ / ทะเบียน -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">ทะเบียนรถ <span class="text-red-400">*</span></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 p-3 bg-slate-800/60 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-400 transition">
            <input type="radio" name="plate" value="2ขร5728" class="accent-amber-400" required onchange="handlePlateChange(this.value)">
            <span class="text-sm font-medium">2ขร5728 (51)</span>
          </label>
          <label class="flex items-center gap-2 p-3 bg-slate-800/60 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-400 transition">
            <input type="radio" name="plate" value="2ขร5734" class="accent-amber-400" required onchange="handlePlateChange(this.value)">
            <span class="text-sm font-medium">2ขร5734 (52)</span>
          </label>
          <label class="flex items-center gap-2 p-3 bg-slate-800/60 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-400 transition">
            <input type="radio" name="plate" value="5ขฒ9840" class="accent-amber-400" required onchange="handlePlateChange(this.value)">
            <span class="text-sm font-medium">5ขฒ9840 (53)</span>
          </label>
          <label class="flex items-center gap-2 p-3 bg-slate-800/60 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-400 transition">
            <input type="radio" name="plate" value="6ขผ4178" class="accent-amber-400" required onchange="handlePlateChange(this.value)">
            <span class="text-sm font-medium">6ขผ4178 (MTL)</span>
          </label>
        </div>
      </div>

      <!-- 2. จ่ายโดย (Pay By) -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">จ่ายโดย (Pay by) <span class="text-red-400">*</span></label>
        <div class="grid grid-cols-3 gap-2">
          <label class="flex items-center justify-center p-3 bg-slate-800/60 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-400 transition text-center">
            <input type="radio" name="payBy" value="cash" class="accent-amber-400 mr-2" required onchange="handlePayByChange(this.value)">
            <span class="text-sm">เงินสด</span>
          </label>
          <label id="creditOption" class="flex items-center justify-center p-3 bg-slate-800/60 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-400 transition text-center">
            <input type="radio" name="payBy" value="credit card" id="creditRadio" class="accent-amber-400 mr-2" required onchange="handlePayByChange(this.value)">
            <span class="text-sm">บัตรเครดิต</span>
          </label>
          <label class="flex items-center justify-center p-3 bg-slate-800/60 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-400 transition text-center">
            <input type="radio" name="payBy" value="orther" class="accent-amber-400 mr-2" required onchange="handlePayByChange(this.value)">
            <span class="text-sm">อื่นๆ</span>
          </label>
        </div>
        
        <!-- ช่องระบุอื่นๆ -->
        <div id="otherInputContainer" class="hidden mt-3">
          <input type="text" id="otherNote" placeholder="ระบุวิธีการชำระ..." class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- กล่องแสดง Available Balance (แสดงเฉพาะตอนเลือกบัตรเครดิต) -->
      <div id="balanceBox" class="hidden p-4 bg-slate-950 rounded-xl border border-amber-500/30 flex justify-between items-center transition-all duration-200">
        <div>
          <p class="text-xs text-slate-400">วงเงินบัตรเครดิตคงเหลือประจำเดือน (15,000 บ.)</p>
          <p id="balanceText" class="text-xl font-bold text-amber-400 mt-0.5">กรุณาเลือกทะเบียนรถ</p>
        </div>
        <div id="loadingBalance" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-amber-400 border-t-transparent"></div>
      </div>

      <!-- 3. ยอดเงิน (Amount) -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">ยอดเงิน (บาท) <span class="text-red-400">*</span></label>
        <input type="number" id="amount" step="0.01" min="1" required placeholder="0.00" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-lg font-semibold text-white focus:outline-none focus:border-amber-400 transition">
      </div>

      <!-- 4. ผู้เติม (Staff) -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">ผู้เติม (Staff) <span class="text-red-400">*</span></label>
        <select id="staff" required class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-amber-400 transition">
          <option value="" disabled selected>-- เลือกรายชื่อผู้เติม --</option>
          <option value="พลธร">พลธร</option>
          <option value="ชัยชนะ">ชัยชนะ</option>
          <option value="ศุภกร">ศุภกร</option>
          <option value="ธวัชชัย">ธวัชชัย</option>
          <option value="ธิติภพ">ธิติภพ</option>
          <option value="ภาณุภณ">ภาณุภณ</option>
          <option value="ธนาเทพ">ธนาเทพ</option>
          <option value="พลพรรธน์">พลพรรธน์</option>
        </select>
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 font-semibold text-slate-950 rounded-xl shadow-lg shadow-amber-500/20 transition duration-200">
        บันทึกข้อมูล
      </button>

    </form>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwIyBrjWukzk3fPowz0U0lqdPJFiwRLsjI5a68q8M-DL7mgfxccQwRSqK0P3DvCdgYX/exec";

    let currentBalance = 0;

    // ดึงยอดเงินคงเหลือจาก GAS
    async function fetchBalance(plate) {
      const balanceText = document.getElementById('balanceText');
      const loading = document.getElementById('loadingBalance');

      if (!plate) {
        balanceText.innerText = "กรุณาเลือกทะเบียนรถก่อน";
        return;
      }

      loading.classList.remove('hidden');
      balanceText.innerText = "กำลังคำนวณยอด...";
      
      try {
        const res = await fetch(`${GAS_API_URL}?plate=${encodeURIComponent(plate)}`);
        const result = await res.json();
        currentBalance = result.balance;
        balanceText.innerText = `${currentBalance.toLocaleString('th-TH', {minimumFractionDigits: 2})} บาท`;
        balanceText.className = currentBalance < 2000 ? "text-xl font-bold text-red-400 mt-0.5" : "text-xl font-bold text-amber-400 mt-0.5";
      } catch (err) {
        balanceText.innerText = "15,000.00 บาท (ค่าเริ่มต้น)";
      } finally {
        loading.classList.add('hidden');
      }
    }

    // เมื่อเปลี่ยนทะเบียนรถ
    async function handlePlateChange(plate) {
      const creditOption = document.getElementById('creditOption');
      const creditRadio = document.getElementById('creditRadio');
      const balanceBox = document.getElementById('balanceBox');

      if (plate === '6ขผ4178') {
        creditOption.classList.add('opacity-40', 'pointer-events-none');
        creditRadio.disabled = true;
        
        if (creditRadio.checked) {
          document.querySelector('input[name="payBy"][value="cash"]').checked = true;
          balanceBox.classList.add('hidden');
        }
      } else {
        creditOption.classList.remove('opacity-40', 'pointer-events-none');
        creditRadio.disabled = false;

        if (creditRadio.checked) {
          fetchBalance(plate);
        }
      }
    }

    // เมื่อเปลี่ยนวิธีการชำระเงิน
    function handlePayByChange(val) {
      const otherContainer = document.getElementById('otherInputContainer');
      const otherInput = document.getElementById('otherNote');
      const balanceBox = document.getElementById('balanceBox');
      const selectedPlate = document.querySelector('input[name="plate"]:checked')?.value;

      if (val === 'orther') {
        otherContainer.classList.remove('hidden');
        otherInput.required = true;
      } else {
        otherContainer.classList.add('hidden');
        otherInput.required = false;
        otherInput.value = '';
      }

      if (val === 'credit card') {
        balanceBox.classList.remove('hidden');
        if (selectedPlate) {
          fetchBalance(selectedPlate);
        } else {
          document.getElementById('balanceText').innerText = "กรุณาเลือกทะเบียนรถด้านบน";
        }
      } else {
        balanceBox.classList.add('hidden');
      }
    }

    // Submit Form
    document.getElementById('fuelForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const plate = document.querySelector('input[name="plate"]:checked')?.value;
      const payBy = document.querySelector('input[name="payBy"]:checked')?.value;
      const otherNote = document.getElementById('otherNote').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const staff = document.getElementById('staff').value;

      // Validation วงเงินบัตร
      if (payBy === 'credit card' && plate !== '6ขผ4178' && amount > currentBalance) {
        Swal.fire({
          icon: 'warning',
          title: 'วงเงินบัตรไม่เพียงพอ',
          text: `ยอดเติม (${amount.toLocaleString()} บ.) เกินวงเงินคงเหลือ (${currentBalance.toLocaleString()} บ.)`,
          confirmButtonColor: '#f59e0b'
        });
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังบันทึกข้อมูล...";

      try {
        const payload = { plate, payBy, otherNote, amount, staff };
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const resData = await response.json();
        
        if (resData.status === 'success') {
          // กำหนดข้อความแจ้งเตือนตามเงื่อนไข
          const formattedAmount = amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          let messageHtml = `<div class="mt-2 text-slate-600 font-medium">ยอดเติม <b>${formattedAmount}</b> บาท</div>`;

          if (payBy === 'credit card' && plate !== '6ขผ4178') {
            const formattedBalance = Number(resData.remainingBalance).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            messageHtml = `<div class="mt-2 text-slate-600 font-medium">ยอดเติม <b>${formattedAmount}</b> บาท<br><span class="text-amber-600 font-semibold">บัตรคงเหลือ ${formattedBalance} บาท</span></div>`;
          }

          Swal.fire({
            icon: 'success',
            title: `บันทึกยอดทะเบียน ${plate} แล้ว`,
            html: messageHtml,
            confirmButtonText: 'ตกลง',
            confirmButtonColor: '#f59e0b'
          });
          
          document.getElementById('fuelForm').reset();
          document.getElementById('balanceBox').classList.add('hidden');
          document.getElementById('balanceText').innerText = "กรุณาเลือกทะเบียนรถ";
          document.getElementById('otherInputContainer').classList.add('hidden');
        } else {
          throw new Error(resData.message);
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'เกิดข้อผิดพลาด',
          text: err.message || 'ไม่สามารถส่งข้อมูลได้',
          confirmButtonColor: '#ef4444'
        });
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "บันทึกข้อมูล";
      }
    });
  </script>
</body>
</html>
